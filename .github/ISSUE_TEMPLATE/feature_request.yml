name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search
        [existing issues](https://github.com/yottadynamics/yottacode/issues)
        first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like yottacode to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art you have looked at.
    validations:
      required: false
  - type: input
    id: prior-art
    attributes:
      label: Prior art
      description: Does another tool already do this? A link helps us match the surface.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I'd like to open a PR"
        - "Maybe, with guidance"
        - "No, just requesting"
    validations:
      required: false
