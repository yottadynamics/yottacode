# Weekly dependency and toolchain vulnerability scan.
# 09:00 EST every Friday is 14:00 UTC. This uses fixed EST rather than
# daylight-saving Eastern Time; update to 13:00 UTC during EDT if desired.
name: Security scan

on:
  schedule:
    - cron: '0 14 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
