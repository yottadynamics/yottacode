# Real-binary coverage for create_document (docx/pdf) and read_document (pdf).
# go.yml's plain `go test ./...` fakes the pandoc/weasyprint subprocesses, so
# nothing there proves the GA docx/pdf claim. This job installs the real tools
# and runs the `integration`-tagged round-trip and PDF extractor suites.
# YC_REQUIRE_DOC_TOOLS=1 turns a missing binary into a failure instead of a
# skip, so a broken runner can't silently pass.
name: Documents integration

on:
  push:
    branches: ["main"]
    paths:
      - "internal/documents/**"
      - "internal/agent/document*.go"
      - "internal/agent/create_document*.go"
      - "internal/documents/pyhelpers/**"
      - "infra/documents.Containerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/documents-integration.yml"
  pull_request:
    paths:
      - "internal/documents/**"
      - "internal/agent/document*.go"
      - "internal/agent/create_document*.go"
      - "internal/documents/pyhelpers/**"
      - "infra/documents.Containerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/documents-integration.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Install pandoc, weasyprint, poppler
        run: sudo apt-get update && sudo apt-get install -y pandoc weasyprint poppler-utils

      - name: Documents integration tests
        env:
          YC_REQUIRE_DOC_TOOLS: "1"
        run: |
          go test -tags integration -count=1 -timeout 300s ./internal/documents/... -v
          go test -tags integration -count=1 -timeout 300s ./internal/agent/ -run DocumentRoundTrip -v
