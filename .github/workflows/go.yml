# Per-push / per-PR CI: build, vet, test on Linux + macOS.
# Windows is intentionally not supported — WSL is the recommended path.
# Release artifacts are built by .github/workflows/release.yml on tag push.

name: Go

on:
  push:
    branches: ["main"]
  # Fire on every PR regardless of target branch — feature-branch-
  # targeted PRs (stacked work like fix/* against feature/*) need
  # the same Linux + macOS verification before merge.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -short skips demo/visualization tests whose stdout would
        # otherwise trip GitHub Actions' Go problem-matcher and surface
        # as spurious "Error:" PR annotations (e.g. TestDemo_CardOutput
        # in internal/tui/). Real tests do not opt into -short.
        run: go test -short -v ./...

      - name: Test (race detector)
        # The subagent/registry concurrency suites (background-subagent
        # lifecycle, the task Registry, the parallel approval gate, the
        # atomic spawn cap) only catch data races under -race; without
        # this step they run but detect nothing. Kept as a separate step
        # (not folded into the run above) so the fast -v run still gates
        # logic failures cleanly and the race report stands on its own.
        # -short keeps the demo/visualization tests out, same as above.
        run: go test -short -race ./...

  acp-smoke:
    # Proves the real, compiled `yottacode acp` binary — not just
    # internal/acp's in-process wire-level tests (which wire a Server
    # directly to an io.Pipe and never touch cobra flag resolution, a
    # real os/exec child process, or real stdin/stdout framing).
    # TestACPSmoke is fully hermetic (builds its own binary, serves its
    # own stub OpenAI-compatible backend) and is skipped by the -short
    # run above, so it needs this dedicated step to ever execute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: ACP subprocess smoke test
        run: go test -run TestACPSmoke -v ./cmd/yottacode

  lsp-smoke:
    # GA LSP support must be proven against real servers, not only fakes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install language servers
        run: |
          set -eu
          go install golang.org/x/tools/gopls@latest
          npm install -g typescript-language-server pyright
          curl -L https://github.com/rust-lang/rust-analyzer/releases/latest/download/rust-analyzer-x86_64-unknown-linux-gnu.gz -o /tmp/rust-analyzer.gz
          gzip -d /tmp/rust-analyzer.gz
          chmod +x /tmp/rust-analyzer
          sudo mv /tmp/rust-analyzer /usr/local/bin/rust-analyzer

      - name: Real-server LSP smoke tests
        env:
          YOTTACODE_LSP_SMOKE_REQUIRED: '1'
        run: |
          set -eu
          smoke_dir="$(mktemp -d)"
          npm install --silent --prefix "$smoke_dir" 'typescript@^5.9.0'
          export YOTTACODE_LSP_TYPESCRIPT_TSSERVER="$smoke_dir/node_modules/typescript/lib"
          test -d "$YOTTACODE_LSP_TYPESCRIPT_TSSERVER"
          go test -run 'Test(Gopls|TypeScriptLanguageServer|PyrightLanguageServer|RustAnalyzer)Smoke' ./internal/lsp

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -s bash
        with:
          scandir: '.'
          additional_files: 'install.sh'
          ignore_paths: 'docs internal cmd .git'

  install-smoke:
    # Run install.sh end-to-end against a pinned released version.
    # Confirms the script can fetch, verify, extract, and install on a
    # clean machine. YOTTACODE_NO_UPDATE_CHECK avoids any background
    # poll once the installed binary is invoked.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: '0.2.0'
      YOTTACODE_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh
        run: |
          set -eu
          export INSTALL_DIR="$RUNNER_TEMP/yottacode-bin"
          bash ./install.sh --no-modify-rc
      - name: Verify installed binary
        run: |
          set -eu
          BIN="$RUNNER_TEMP/yottacode-bin/yottacode"
          test -x "$BIN"
          "$BIN" --version | tee /tmp/ver.txt
          grep -q "$VERSION" /tmp/ver.txt
