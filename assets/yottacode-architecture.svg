<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">yottacode technical architecture</title>
  <desc id="desc">A local-first agent loop connects terminal interfaces, runtime policy, typed local tools, persistence, subagents, worktrees, and provider adapters.</desc>
  <defs>
    <style>
      .bg { fill: #0b0f0d; }
      .group { fill: #111814; stroke: #2de38f; stroke-width: 1.4; rx: 16; }
      .node { fill: #16231d; stroke: #6bf0ad; stroke-width: 1.2; rx: 10; }
      .external { fill: #18202b; stroke: #8ab4ff; stroke-width: 1.2; rx: 10; }
      .title { fill: #e8fff2; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #e8fff2; font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #b8d8c6; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { stroke: #74f7b5; stroke-width: 2; fill: none; marker-end: url(#arrow); opacity: .85; }
      .edge2 { stroke: #8ab4ff; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); opacity: .8; }
      .groupLabel { fill: #82f5b8; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .02em; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#74f7b5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ab4ff"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="46">yottacode — technical architecture</text>
  <text class="small" x="40" y="70">Current-state README overview: terminal UX, local tool execution, approvals, memory, subagents, worktrees, and model routing.</text>

